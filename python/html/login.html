<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - My Ecommerce Store</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f6f6; }
        .login-box { max-width: 350px; margin: 4em auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(253,160,133,0.15); padding: 2em; text-align: center; }
        input[type="text"], input[type="password"] { width: 90%; padding: 0.7em; margin: 1em 0; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #007bff; color: #fff; border: none; padding: 0.7em 1.2em; border-radius: 24px; cursor: pointer; font-size: 1em; font-weight: bold; margin-top: 1em; }
        button:hover { background: #0056b3; }
        .signup-link { margin-top: 1em; display: block; }
    </style>
</head>
<body>
    <nav>
        <a href="sever.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="about.html">About</a>
        <a href="login.html">Login</a>
    </nav>
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" placeholder="Email or Mobile">
        <input type="password" placeholder="Password">
        <button>Login</button>
        <a href="#" class="signup-link">New user? Sign up</a>
    </div>
</body>
</html>
